name: Poll live NFL week

# Runs scripts/poll-once.ts on a schedule so live scores/red-zone data keep
# updating during game windows without needing a laptop open running
# poll-live-week.ts. See README-poll-live-week for the manual alternative.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   - Secret   DATABASE_URL       your production database connection string
#   - Variable CURRENT_NFL_WEEK   the week number to poll (update this once
#                                  a week -- e.g. "1", then "2" the next
#                                  week, etc.)
#
# You can also trigger a one-off run manually from the Actions tab
# ("Run workflow"), optionally overriding the week for that run only.
on:
  schedule:
    # All times UTC. Windows are deliberately generous (wide enough to
    # cover both EST and EDT kickoffs) rather than exact, since an extra
    # no-op-ish run just costs a few seconds.
    #
    # Covers every evening a game can plausibly kick off (Wed through Mon
    # night), not just the "normal" Thu/Sun/Mon slate -- Week 1 (and other
    # weeks with an early-season/international opener) can have a game as
    # early as Wednesday night ET, which is NOT the same thing as "Thursday
    # Night Football" the following night. Missing that window was exactly
    # why Week 1's opener got stuck showing "Live" long after it ended: the
    # old schedule only started at Thursday 23:00 UTC, hours after that
    # game had already kicked off (and finished).
    - cron: "*/10 23 * * 3" # Wednesday night game (season openers, etc.)
    - cron: "*/10 0-4 * * 4" # ...continuing into Thursday
    - cron: "*/10 23 * * 4" # Thursday night game
    - cron: "*/10 0-4 * * 5" # ...continuing into Friday
    - cron: "*/10 23 * * 5" # Friday night game (e.g. Black Friday)
    - cron: "*/10 0-4 * * 6" # ...continuing into Saturday
    - cron: "*/10 13-23 * * 0" # Sunday's full slate
    - cron: "*/10 0-4 * * 1" # ...continuing into Monday
    - cron: "*/10 23 * * 1" # Monday night game
    - cron: "*/10 0-4 * * 2" # ...continuing into Tuesday
  workflow_dispatch:
    inputs:
      week:
        description: "Week to poll (overrides the CURRENT_NFL_WEEK variable for this run)"
        required: false

# Only one poll should ever be in flight at a time -- overlapping runs would
# both try to write the same Game/PlayerGameStat rows.
concurrency:
  group: poll-live
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_BASE_URL: "https://playfgl.vercel.app" # update if your deployed URL ever changes
      WEEK: ${{ github.event.inputs.week || vars.CURRENT_NFL_WEEK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Poll once
        run: npx tsx scripts/poll-once.ts "$WEEK" "$APP_BASE_URL"
